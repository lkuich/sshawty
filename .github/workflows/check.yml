name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_TAG" = "v$version"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          scripts/package-macos.sh
          ditto -c -k --keepParent dist/sshawty.app "dist/sshawty-$PLATFORM.zip"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path target/release/sshawty.exe,README.md -DestinationPath dist/sshawty-windows-x86_64.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/sshawty-linux-x86_64.tar.gz -C target/release sshawty -C "$GITHUB_WORKSPACE" README.md
      - uses: actions/upload-artifact@v4
        with:
          name: sshawty-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sshawty-*
          path: dist
          merge-multiple: true
      - name: Publish downloads and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          ## Downloads
          - **macos-arm64.zip**: Apple Silicon Macs.
          - **macos-x86_64.zip**: Intel Macs.
          - **windows-x86_64.zip**: 64-bit Windows.
          - **linux-x86_64.tar.gz**: 64-bit Linux (Ubuntu 24.04 or compatible; X11/XWayland).

          Extract the archive and launch sshawty. OpenSSH 9+ is required for uploads. macOS builds are ad-hoc signed, not Apple-notarized; Windows builds are unsigned. See the README for setup and platform requirements.

          SHA256SUMS.txt contains checksums for every download.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" *.zip *.tar.gz SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" *.zip *.tar.gz SHA256SUMS.txt --verify-tag --title "sshawty $RELEASE_TAG" --notes-file release-notes.md
          fi
