name: Desktop checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: runner.os == 'macOS'
        run: scripts/package-macos.sh && ditto -c -k --keepParent dist/SSHawty.app dist/SSHawty-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SSHawty-${{ runner.os }}
          path: |
            dist/*.zip
            target/release/sshawty
            target/release/sshawty.exe
