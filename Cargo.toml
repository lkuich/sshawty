[package]
name = "sshawty"
version = "0.1.6"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "accesskit", "clipboard", "default_fonts", "system_fonts", "x11", "wayland"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSFilePromiseReceiver", "NSDragging", "NSPasteboard", "NSView", "NSWindow", "NSApplication"] }
objc2-foundation = "0.3"
block2 = "0.6"
raw-window-handle = "0.6"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = "0.13"
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "macos_drop"
path = "tests/macos_drop.rs"
harness = false

[build-dependencies]
winresource = "0.1"
